<!DOCTYPE html>
<html>
<head>
    <title>Div with Image, Video and Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* First div: 2 columns */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Second div: 3 columns */
        .three-columns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .box {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        img, video {
            width: 100%;
            height: auto;
        }
    </style>
</head>
